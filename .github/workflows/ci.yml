name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'

      - name: Lint (web)
        run: npm run lint --workspace=apps/web

      - name: Lint (api)
        run: npm run lint --workspace=apps/api

      - name: Typecheck (web)
        run: npm run typecheck --workspace=apps/web

      - name: Typecheck (api)
        run: npm run typecheck --workspace=apps/api

      - name: Prettier format check
        run: npm run format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
      JWT_ACCESS_SECRET: 'ci-only-access-secret-not-for-production-use-1234'
      JWT_REFRESH_SECRET: 'ci-only-refresh-secret-not-for-production-use-1234'
      NEXT_PUBLIC_API_URL: 'http://localhost:4000'
      NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Seed reference data
        working-directory: apps/api
        run: npx tsx prisma/seed.ts

      - name: Build API
        run: npm run build --workspace=apps/api

      - name: Smoke-test API health endpoint
        working-directory: apps/api
        run: |
          node dist/server.js &
          API_PID=$!
          sleep 3
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/api/v1/health)
          kill $API_PID
          if [ "$RESPONSE" != "200" ]; then
            echo "Health check failed with status $RESPONSE"
            exit 1
          fi
          echo "Health check passed"

      - name: Build Web
        run: npm run build --workspace=apps/web

  security-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit (high+critical, non-blocking)
        run: npm audit --audit-level=high || true
