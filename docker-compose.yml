# ==============================================================================
# Sai Yadadri Seva Ashram Platform — Local Development / Single-Host Deployment
# Topology per design/15-Deployment-Architecture.md §2
#
# Usage:
#   docker compose up -d --build      # start everything
#   docker compose logs -f api        # tail a service's logs
#   docker compose down               # stop everything
#   docker compose down -v            # stop and wipe the Postgres volume
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: sysa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sysa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sysa_password}
      POSTGRES_DB: ${POSTGRES_DB:-sysa_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sysa_user} -d ${POSTGRES_DB:-sysa_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sysa-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sysa-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      API_URL: ${API_URL:-http://localhost:4000}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sysa_user}:${POSTGRES_PASSWORD:-sysa_password}@postgres:5432/${POSTGRES_DB:-sysa_db}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${WEB_URL:-http://localhost:3000}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@sysaindia.org}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${API_PORT:-4000}:4000'
    volumes:
      - api_logs:/app/apps/api/logs
      - api_uploads:/app/apps/api/uploads
    networks:
      - sysa-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SITE_URL: ${WEB_URL:-http://localhost:3000}
    container_name: sysa-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-3000}:3000'
    networks:
      - sysa-network

  nginx:
    image: nginx:1.27-alpine
    container_name: sysa-nginx
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - sysa-network

networks:
  sysa-network:
    driver: bridge

volumes:
  postgres_data:
  api_logs:
  api_uploads:
