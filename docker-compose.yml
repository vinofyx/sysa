# ==============================================================================
# Sai Yadadri Seva Ashram Platform — Local Development / Single-Host Deployment
# Topology per design/15-Deployment-Architecture.md §2
#
# Usage:
#   docker compose up -d --build      # start everything
#   docker compose logs -f api        # tail a service's logs
#   docker compose down               # stop everything
#   docker compose down -v            # stop and wipe the MySQL volume
# ==============================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: sysa-mysql
    restart: unless-stopped
    # utf8mb4 + utf8mb4_0900_ai_ci for full English/Telugu/Unicode/emoji
    # support (see MYSQL_MIGRATION_REPORT.md) — if targeting a MySQL build
    # where utf8mb4_0900_ai_ci is unavailable (pre-8.0.1), fall back to
    # utf8mb4_unicode_ci here and re-generate the migration accordingly.
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      MYSQL_USER: ${MYSQL_USER:-sysa_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sysa_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sysa_db}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-u',
          'root',
          '-p${MYSQL_ROOT_PASSWORD:-change-me}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sysa-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sysa-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      API_URL: ${API_URL:-http://localhost:4000}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      # Points at the external production DATABASE_URL (Hostinger) by default —
      # NOT the local `mysql` service below, which is unused unless DATABASE_URL
      # is left unset. Previously hardcoded to the internal container, which
      # would have silently connected to an empty local DB in production.
      DATABASE_URL: ${DATABASE_URL:-mysql://${MYSQL_USER:-sysa_user}:${MYSQL_PASSWORD:-sysa_password}@mysql:3306/${MYSQL_DATABASE:-sysa_db}}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${WEB_URL:-http://localhost:3000}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@sysaindia.org}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${API_PORT:-4000}:4000'
    volumes:
      - api_logs:/app/apps/api/logs
      - api_uploads:/app/apps/api/uploads
    networks:
      - sysa-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SITE_URL: ${WEB_URL:-http://localhost:3000}
    container_name: sysa-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-3000}:3000'
    networks:
      - sysa-network

  nginx:
    image: nginx:1.27-alpine
    container_name: sysa-nginx
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - sysa-network

networks:
  sysa-network:
    driver: bridge

volumes:
  mysql_data:
  api_logs:
  api_uploads:
