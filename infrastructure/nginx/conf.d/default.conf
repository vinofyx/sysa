# ==============================================================================
# Sai Yadadri Seva Ashram Platform — Reverse Proxy Routing
#
# Routes /api/* to the backend, everything else to the Next.js frontend.
# TLS is terminated directly here via Let's Encrypt (see the `certbot` service
# in docker-compose.yml and infrastructure/README-SSL.md for the one-time
# issuance command) — port 80 exists only to redirect to HTTPS and to serve
# the ACME HTTP-01 challenge during issuance/renewal.
# ==============================================================================

upstream sysa_web {
    server web:3000;
}

upstream sysa_api {
    server api:4000;
}

# --- Plain HTTP: ACME challenge + redirect everything else to HTTPS ---
server {
    listen 80;
    server_name sysa.in www.sysa.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: the real application ---
server {
    listen 443 ssl;
    http2 on;
    server_name sysa.in www.sysa.in;

    # Populated by certbot into the shared ./infrastructure/certbot/conf volume
    # (see docker-compose.yml `certbot` service) — do not create these by hand.
    ssl_certificate     /etc/letsencrypt/live/sysa.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sysa.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000" always;

    limit_req zone=general burst=20 nodelay;

    # --- Backend API ---
    location /api/ {
        proxy_pass http://sysa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Razorpay webhook needs a larger body allowance and no request buffering delay.
    location /api/v1/webhooks/ {
        proxy_pass http://sysa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # --- Frontend (Next.js) ---
    location / {
        proxy_pass http://sysa_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Next.js static assets — long cache, immutable (hashed filenames).
    location /_next/static/ {
        proxy_pass http://sysa_web;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
