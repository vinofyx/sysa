# ==============================================================================
# Sai Yadadri Seva Ashram Platform — Reverse Proxy Routing
#
# Routes /api/* to the backend, everything else to the Next.js frontend.
# TLS termination is handled by the CDN/edge layer in production
# (design/15-Deployment-Architecture.md §2) — this config serves plain HTTP
# behind that edge, or can be extended with a server{} block for direct TLS
# if Nginx is the outermost layer in a given deployment.
# ==============================================================================

upstream sysa_web {
    server web:3000;
}

upstream sysa_api {
    server api:4000;
}

server {
    listen 80;
    server_name _;

    limit_req zone=general burst=20 nodelay;

    # --- Backend API ---
    location /api/ {
        proxy_pass http://sysa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Razorpay webhook needs a larger body allowance and no request buffering delay.
    location /api/v1/webhooks/ {
        proxy_pass http://sysa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # --- Frontend (Next.js) ---
    location / {
        proxy_pass http://sysa_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Next.js static assets — long cache, immutable (hashed filenames).
    location /_next/static/ {
        proxy_pass http://sysa_web;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
