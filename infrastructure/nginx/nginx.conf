# ==============================================================================
# Sai Yadadri Seva Ashram Platform — Nginx Base Configuration
# Reverse proxy topology per design/15-Deployment-Architecture.md §2
# ==============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log  /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/xml
        image/svg+xml;

    # Basic request-rate limiting zone — mirrors the API's own rate limiting
    # (documentation/12-Security-Requirements.md SEC-INFRA-04) as a defense-in-depth layer.
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

    client_max_body_size 5m;

    include /etc/nginx/conf.d/*.conf;
}
